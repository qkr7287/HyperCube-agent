services:
  agent:
    build: .
    restart: unless-stopped
    env_file: .env
    # GPU hosts must set AGENT_RUNTIME=nvidia in .env so the nvidia-container-
    # toolkit kicks in and injects host's nvidia-smi + driver libs. Non-GPU
    # hosts leave it unset and stay on runc. Hosts whose daemon has
    # `default-runtime: nvidia` (e.g. 63) work either way. Mirrors dev compose.
    runtime: ${AGENT_RUNTIME:-runc}
    # Even when the nvidia runtime is active, the toolkit refuses to expose
    # GPU devices unless these env vars are set (secure-default). Harmless on
    # non-GPU hosts — ignored if the runtime is runc.
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    # Host network: agent acts as a host-level monitor, and same-host backend
    # registrations record the real LAN IP rather than a docker bridge IP.
    network_mode: host
    privileged: true
    pid: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /var/run/utmp:/var/run/utmp:ro
      - /etc/hostname:/host/etc/hostname:ro
      # Model cache must persist to the host so downstream containers (created
      # by backend with bind mount to the same host path) can read the asset.
      # Without this, prepare_model_assets writes to the agent's writable
      # layer only — files vanish on agent restart AND any container bind-
      # mounting the host path sees an empty directory.
      - /var/lib/hypercube-agent/model-cache:/var/lib/hypercube-agent/model-cache
    group_add:
      - "${DOCKER_GID:-999}"
    # Cap json-file growth at 20MB x 10 = 200MB per container. Without this
    # the log grows unbounded over the agent's long lifetime.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
